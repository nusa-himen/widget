<script>
document.addEventListener('DOMContentLoaded', function () {
const IST_OFFSET_MS = 5.5 * 60 * 60 * 1000; // IST is UTC+5:30

function parseIndianEventToLocal(eventStr) {
if (!eventStr) return null;
const parts = eventStr.trim().split(' ');
if (parts.length < 3) return null;

const [datePart, timePart, period] = parts;
const [day, month, year] = datePart.split('-').map(Number);
let [hour, minute] = timePart.split(':').map(Number);
const ampm = period.toUpperCase();

if (ampm === 'PM' && hour !== 12) hour += 12;
if (ampm === 'AM' && hour === 12) hour = 0;

const istAsUtcMs = Date.UTC(year, month - 1, day, hour, minute) - IST_OFFSET_MS;
return new Date(istAsUtcMs);
}

function pad(n, len = 2) {
return String(n).padStart(len, '0');
}

function formatHHMMSSFromMs(ms) {
const totalSeconds = Math.max(0, Math.floor(ms / 1000));
const hours = Math.floor(totalSeconds / 3600);
const minutes = Math.floor((totalSeconds % 3600) / 60);
const seconds = totalSeconds % 60;
return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
}

function formatElapsedFromMs(ms) {
if (ms < 0) ms = 0;
const totalSeconds = Math.floor(ms / 1000);
const minutes = Math.floor(totalSeconds / 60);
const seconds = totalSeconds % 60;
return `${pad(minutes)}:${pad(seconds)}`;
}

function formatLocalMatchTime(dateObj) {
// Show like "7:30 PM"
const opts = { hour: 'numeric', minute: '2-digit', hour12: true };
return dateObj.toLocaleTimeString([], opts);
}

function updateAll() {
const now = new Date();

document.querySelectorAll('a.container-06').forEach(link => {
const evStr = link.getAttribute('data-event-time');
const durationMin = parseInt(link.getAttribute('data-match-duration')) || 115;

const start = parseIndianEventToLocal(evStr);
if (!start || isNaN(start.getTime())) return;

const end = new Date(start.getTime() + durationMin * 60 * 1000);
const matchTimeEl = link.querySelector('.match-time');
const countdownEl = link.querySelector('.match-countdown');

if (now < start) {
// Before match - show converted local match time + countdown
const localTimeString = formatLocalMatchTime(start);
if (matchTimeEl) matchTimeEl.textContent = localTimeString;
if (countdownEl) countdownEl.textContent = formatHHMMSSFromMs(start - now);
} else if (now >= start && now <= end) {
// During match - LIVE + elapsed time
if (matchTimeEl) {
matchTimeEl.innerHTML = '<span class="live-pulse"><span class="live-badge">LIVE</span></span>';
const localTimeString = formatLocalMatchTime(start);
countdownEl.innerHTML = localTimeString
}
// if (countdownEl) countdownEl.textContent = formatElapsedFromMs(now - start);
} else {
// After match - ended
if (matchTimeEl) matchTimeEl.textContent = 'Full Time';
const localTimeString = formatLocalMatchTime(start);
if (countdownEl) countdownEl.textContent = localTimeString
}
});
}

updateAll();
setInterval(updateAll, 1000);
});
</script>
